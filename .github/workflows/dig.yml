# **망이 막힌 세션 대신 러너에서 dig 를 돌린다.**
#
# 에이전트 컨테이너는 나가는 길이 프록시에서 막힌다(실측 2026-10-09: 22개 문 중 21개 403).
# Actions 러너는 열려 있다. `dig/requests/<이름>.json` 을 밀면 이것이 `dig/batch.py` 로
# 돌리고 `dig/results/<이름>/` 를 **같은 브랜치에** 되민다. GITHUB_TOKEN 의 밀기는
# 워크플로를 다시 깨우지 않으므로 고리가 안 생긴다.
#
# 이미 결과가 있는 요청은 건너뛴다 -- 다시 받으려면 결과 폴더를 지우고 민다.
name: dig (러너에서 캐기)

on:
  push:
    paths:
      - 'dig/requests/**.json'
      - '.github/workflows/dig.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dig-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dig:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pdftotext
        # apt 목록을 먼저 새로 한다 -- 안 하면 옛 목록의 .deb 가 404 다(실측 run #1).
        # 못 깔아도 멈추지 않는다: pdf 만 '못 받음' 으로 남고 나머지는 돈다.
        run: (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils) || echo "poppler 못 깜 -- pdf 는 건너뛴다"
      - name: 요청마다 dig
        run: |
          set -u
          for req in dig/requests/*.json; do
            name=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["이름"])' "$req")
            if [ -f "dig/results/$name/요약.json" ]; then
              echo "건너뜀: $name (결과 있음)"
              continue
            fi
            python3 dig/batch.py "$req" || echo "끝값 $? -- 요약.json 에 까닭이 있다"
          done
      - name: 요약을 로그에도
        if: always()
        run: for f in dig/results/*/요약.json; do echo "== $f"; cat "$f"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dig-results
          path: dig/results
          if-no-files-found: ignore
      - name: 결과 되밀기
        run: |
          set -u
          git config user.name "dig-runner"
          git config user.email "dig-runner@users.noreply.github.com"
          git add dig/results
          if git diff --cached --quiet; then
            echo "새 결과 없음"
            exit 0
          fi
          git commit -q -m "dig: 러너에서 받은 결과 ($GITHUB_SHA)"
          B="$GITHUB_REF_NAME"
          for i in 1 2 3; do
            git push origin "HEAD:$B" && exit 0
            # rebase 가 아니라 merge -- 같이 쓰는 브랜치일 수 있다(CLAUDE.md).
            git pull --no-rebase --no-edit origin "$B" || true
            sleep $((i * 5))
          done
          exit 1
