 l.fillStyle='#161b22';l.fillRect(166,0,80,9);l.fillStyle='#8b949e';l.font='9px sans-serif';l.fillText('2cm',0,16);l.fillText('7',70,16);l.fillText('30cm',140,16);l.fillText('미지(어둠)',180,8)}

window.renderAt=function(k){k=Math.max(0,Math.min(F.length-1,k|0));const f=F[k];

  document.getElementById('hlb').innerHTML=hn.map((n,i)=>`<div class="hr"><span>${n}</span>${bar(f.health[i],f.health[i]>0.7?'#3fb950':f.health[i]>0.4?'#d29922':'#f85149')}<span class="mono">${f.health[i].toFixed(2)}</span></div>`).join('')+
   `<div class="row"><span>슬립 추정/참</span><span class="mono">${f.slip.toFixed(2)}/${f.true_slip.toFixed(2)}</span></div><div class="row"><span>기울기·위험</span><span class="mono">${f.tilt.toFixed(2)} · ${f.risk.toFixed(2)}</span></div>`;
  document.getElementById('batb').innerHTML=`<div style="font-size:20px;font-weight:700">${(f.bat*100).toFixed(1)}%</div>${bar(f.bat,f.bat>f.need+0.08?'#3fb950':'#f85149')}
   <div class="row"><span>귀환필요</span><b>${(f.need*100).toFixed(1)}%</b></div><div class="row"><span>전압</span><b>${f.V} V</b></div><div class="row"><span>전력</span><b>${f.P} W</b></div><div class="row"><span>사용</span><b>${f.Wh} Wh</b></div><div class="row"><span>모터 릴레이</span><b style="color:${f.relay?'#3fb950':'#f85149'}">${f.relay?'ON':'차단'}</b></div>`;
  document.getElementById('datb').innerHTML=`<div class="row"><span>원시 로그</span><b>${fmtB(f.raw)}/s</b></div><div class="row"><span>하향(압축)</span><b>${fmtB(f.down)}/s</b></div><div class="row"><span>압축비</span><b>${f.down>0?(f.raw/f.down).toFixed(0):'-'}:1</b></div><div class="row"><span>링크 대역</span><b>${fmtB(f.bw/8)}/s</b></div><div class="row"><span>지연·끊김</span><b>${f.lat}s · ${f.link}s</b></div><div class="row"><span>저장소</span><b>${(f.store*100).toFixed(1)}%</b></div>${bar(f.store,f.store>0.85?'#f85149':'#58a6ff')}`;
  // response steps lit by events so far
  const ks=new Set((M.events||[]).filter(e=>e.t<=f.t).map(e=>e.kind)); const deg=f.safety==='DEGRADED'||f.safety==='RETURN';
  const on=[ks.has('detect')||f.act==='AVOID'||f.act==='SAFE_STOP'||f.act==='EMERGENCY'||f.act==='RETURN', ks.has('isolate'), ks.has('degrade')||deg, ks.has('recover')||ks.has('stop')||f.act==='SAFE_STOP'||f.act==='EMERGENCY'];
  for(let i=0;i<4;i++){const e=document.getElementById('s'+i);e.className=on[i]?((i==3&&(f.act==='EMERGENCY'||f.act==='SAFE_STOP'))?'stop':'on'):''}
  const ev=(M.events||[]).filter(e=>e.t<=f.t).slice(-3);
  document.getElementById('evl').innerHTML=ev.map(e=>`${e.t.toFixed(0)}s ${e.kind}: ${e.msg}`.slice(0,62)).join('<br>');
};
window.NF=F.length; renderAt(0); window.__ready=true;
</script></body></html>
